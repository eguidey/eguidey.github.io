<section class="widget bio">
  <h3>{{ site.tagline }}</h3>
  <p>{{ site.bio }}</p>
  <a class="more" href="{{ '/about/' | relative_url }}">Read more →</a>
  {% include social-links.html %}

    <div class="bio-certs">
    <a class="cert-badge" href="{{ '/certifications/' | relative_url }}">Certifications →</a>
  </div>
  
</section>

<section class="widget">
  <h3>Projects</h3>
  <ol class="recent">
    <li><a href="https://github.com/eguidey/aws-pipeline-2">AWS AppSec Pipeline</a></li>
    <li><a href="https://github.com/eguidey/Helpdesk-toolkit">Help Desk Toolkit</a></li>
  </ol>
  <a class="more" href="{{ '/projects/' | relative_url }}">All projects →</a>
</section>

<section class="widget">
  <h3>Tags</h3>
  <div class="tag-cloud">
    {% assign tags = site.tags | sort %}
    {% for tag in tags %}
      <a class="tag" href="{{ '/tags/' | relative_url }}#{{ tag[0] | slugify }}"><span class="count">{{ tag[1].size }}</span>{{ tag[0] }}</a>
    {% endfor %}
  </div>
</section>
